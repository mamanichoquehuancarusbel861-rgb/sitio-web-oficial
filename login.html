<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferretería STUDIO | Iniciar Sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { background-color: #0f111a; color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: #181b29; border: 1px solid #2d3248; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; }
    .brand-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; }
    .badge-pro { background: #3b82f6; color: #fff; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; vertical-align: middle; }
    .subtitle { color: #8a92b2; font-size: 0.9rem; margin-bottom: 24px; }
    .form-group { text-align: left; margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; color: #a0aec0; margin-bottom: 8px; font-weight: 500; }
    .form-group input { width: 100%; padding: 12px 16px; background: #0f111a; border: 1px solid #2d3248; border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; }
    .form-group input:focus { border-color: #3b82f6; }
    .btn-login { width: 100%; padding: 12px; background: #3b82f6; border: none; border-radius: 8px; color: #fff; font-weight: 600; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
    .btn-login:hover { background: #2563eb; }
    .error-msg { color: #ef4444; font-size: 0.85rem; margin-bottom: 16px; display: none; }
  </style>
</head>
<body>

  <div class="login-card">
    <h1 class="brand-title">Ferretería <span class="badge-pro">STUDIO</span></h1>
    <p class="subtitle">Ingresa tus credenciales para acceder</p>

    <div id="error-msg" class="error-msg">Usuario o contraseña incorrectos.</div>

    <form onsubmit="hacerLogin(event)">
      <div class="form-group">
        <label for="username">Usuario:</label>
        <input type="text" id="username" placeholder="admin" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login">Iniciar Sesión</button>
    </form>
  </div>

  <script>
    function hacerLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      // Simulación de validación (puedes ajustarla según tu backend)
      if (user === 'admin' && pass === '1234') {
        localStorage.setItem('auth_authenticated', 'true');
        window.location.href = 'index.html';
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    }

    // Si ya está autenticado, redirigir automáticamente al dashboard
    if (localStorage.getItem('auth_authenticated') === 'true') {
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
